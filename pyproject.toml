[project]
name = "contentfactory"
version = "0.1.0"
description = "Local-first open-source factory for faceless short-form video"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ContentFactory contributors" }]
keywords = [
  "faceless-video",
  "youtube-shorts",
  "tiktok",
  "ffmpeg",
  "gemini",
  "open-source",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Video",
]

[project.urls]
Homepage = "https://github.com/YOUR_USER/ContentFactory"
Documentation = "https://github.com/YOUR_USER/ContentFactory#readme"
Issues = "https://github.com/YOUR_USER/ContentFactory/issues"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
